spring:
  application:
    name: mountain-inventory
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_management_system}
    username: ${SPRING_DATASOURCE_USERNAME:ims_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
  notifications:
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      admin: ${NOTIFICATIONS_ADMIN_EMAIL:admin@inventory.local}
